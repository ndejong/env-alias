[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.version]
path = "src/env_alias/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/env_alias"]


[project]
name = "env-alias"
dynamic = ["version"]
description = "Powerful helper utility to create shell alias commands to easily set collections of environment variables often with secret values from a variety of data-sources and data-formats."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-2-Clause"
authors = [{name = "Nicholas de Jong", email = "ndejong@threatpatrols.com"}]
keywords = ["env-alias", "shell", "env", "alias", "bash"]
classifiers = [
    "Topic :: Security",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyyaml>=5.0",
    "pydantic>=2.0.0",
]

[project.scripts]
env-alias = "env_alias.main:entrypoint"

[project.urls]
Homepage = "https://github.com/threatpatrols/env-alias"
Repository = "https://github.com/threatpatrols/env-alias.git"
Documentation = "https://threatpatrols.github.io/env-alias/"
"Bug Tracker" = "https://github.com/threatpatrols/env-alias/issues"

[project.optional-dependencies]
dev = [
    "basedpyright>=1.20.0",
    "ruff>=0.8.0",
    "pytest>=7.0.0",
    "pytest-cov>=5.0.0",
    "hatch>=1.13.0",
    "types-PyYAML",
    "requests>=2.28.0",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=env_alias --cov-report=term-missing --cov-report=html -m 'not network and not slow' --cov-fail-under=80"
markers = [
    "network: tests that reach the live network (excluded by default)",
    "slow: tests that build wheels or run large iterations (excluded by default)",
    "requires_keepassxc: requires the keepassxc-cli binary on PATH",
    "requires_ansible_vault: requires the ansible-vault binary on PATH",
]


[tool.ruff]
target-version = "py310"
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
]
ignore = [
    "SIM108",
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["env_alias"]


[tool.basedpyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingImports = "none"
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownLambdaType = "none"
reportUnknownParameterType = "none"
reportGeneralTypeIssues = "warning"
reportArgumentType = "warning"
reportAttributeAccessIssue = "warning"
reportOptionalMemberAccess = "warning"
reportPossiblyUnboundVariable = "warning"
include = ["src/env_alias", "tests"]
exclude = ["**/node_modules", "**/__pycache__", "venv", ".venv"]
