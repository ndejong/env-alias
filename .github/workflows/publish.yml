name: publish

on:
  push:
    tags:
      - "v*"

# Trusted publishing: the PyPI-side environment provides the OIDC credential,
# no long-lived API token is stored.
permissions:
  contents: write
  id-token: write
  pull-requests: read

jobs:
  tag-alignment:
    name: "verify tag == __version__"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify git tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${TAG_VERSION#v}"
          PKG_VERSION=$(python -c "import sys; sys.path.insert(0, 'src'); import env_alias; print(env_alias.__version__)")
          echo "Tag version: $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Pushed git tag '$TAG_VERSION' does not match package version '$PKG_VERSION' in src/env_alias/__init__.py"
            exit 1
          fi

  build-and-publish:
    name: "build + GitHub Release + PyPI"
    needs: tag-alignment
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
